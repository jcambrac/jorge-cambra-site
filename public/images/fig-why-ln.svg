<text x="560" y="58" font-size="14" fill="#6b7280">2. The sum: adding stays readable, multiplying vanishes</text>
<rect x="560" y="80" width="400" height="125" rx="10" fill="#f5f7fa" stroke="#d93f3f" stroke-width="2"/>
<text x="576" y="110" font-size="15" fill="#d93f3f" font-weight="700">Multiply 1,000 posts, 0.9 each</text>
<text x="576" y="142" font-size="14" fill="#1f2328">0.9 × 0.9 × 0.9 × … = 0.000…0017 (45 zeros)</text>
<text x="576" y="176" font-size="20" fill="#d93f3f" font-weight="700">a computer rounds it to 0</text>
<rect x="560" y="225" width="400" height="125" rx="10" fill="#f5f7fa" stroke="#2f9e44" stroke-width="2"/>
<text x="576" y="255" font-size="15" fill="#2f9e44" font-weight="700">Add −ln of each instead</text>
<text x="576" y="287" font-size="14" fill="#1f2328">0.105 + 0.105 + 0.105 + …</text>
<text x="576" y="321" font-size="20" fill="#2f9e44" font-weight="700">= 105.4: an ordinary number</text>
<text x="560" y="395" font-size="14" fill="#1f2328">ln(a · b) = ln(a) + ln(b): the product becomes a sum.</text>
